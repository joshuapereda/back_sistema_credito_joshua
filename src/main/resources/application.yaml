server:
    #PUERTO
    port: 9600
spring: 
    application:
        # NOMBRE DE LA APLICACIÓN
        name: control-clientes
    datasource:
        # CONFIGURACIÓN DE LA BASE DE DATOS POSTGRESQL
        driver-class-name: org.postgresql.Driver
        # URL DE CONEXIÓN A LA BASE DE DATOS
        # control-clientes - NOMBRE DE LA BASE DE DATOS
        url: jdbc:postgresql://localhost:5432/control-clientes
        # USUARIO Y CONTRASEÑA
        username: postgres
        password: admin
    jpa:
        # DDL-AUTO CONFIGURADO EN CREATE-DROP PARA CREAR Y 
        # ELIMINAR LAS TABLAS EN CADA EJECUCIÓN
        #ddl-auto: create-drop

        hibernate:
           ddl-auto: update
        show-sql: true 

#Anadir configuracion para trabajar con Loggs
logging:
    level:
        root: INFO
        #como esta creado nuestro proyecto
        com.codeper.ControlClientes: DEBUG
        org.springframework.web: WARN
        org.hibernate: WARN
    #Configurar archivo para guardar nuestros logs
    file:
        #dura de donde va estar el archivo
        name: logs/control-cliente.log
    logback:
        rollingpolicy:
            file-name-pattern: logs/control-cliente-%d{yyyy-MM-dd}.%i.log
            #indicar cada cuantos dias va eliminar el historial de los loggs guardados
            max-history: 30
            #tamaño maximo de archivo
            max-file-size: 10MB
            #el total de logs que no pase de 1 GB
            total-size-cap: 1GB

        
          
            
