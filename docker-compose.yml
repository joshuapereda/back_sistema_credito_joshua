services:
  db:
    image: postgres:17-alpine
    container_name: control-clientes-db
    environment:
      POSTGRES_DB: control-clientes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"   # 5433 en tu PC para no chocar con un PostgreSQL local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d control-clientes"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: control-clientes-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro de Docker la BD se llama "db", no "localhost"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/control-clientes
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "9600:9600"
    volumes:
      - ./logs:/app/logs

volumes:
  pgdata:
